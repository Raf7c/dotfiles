# The repo's quality bar on a neutral runner: three-shell syntax,
# shellcheck (warning and above), shfmt against .editorconfig.
# Actions are pinned to full commit SHAs: a tag is mutable — the
# tj-actions attack (CVE-2025-30066) repointed existing tags; a SHA
# cannot be repointed. Dependabot proposes the bumps.
---
name: ci

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: install shells
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q dash zsh

      # Same shellcheck/shfmt versions as every machine: mise reads the
      # repo's own config.toml — one version source for local and CI.
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d  # v4.2.0
        env:
          MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.config/mise/config.toml
        with:
          install_args: shellcheck shfmt yamllint

      - name: syntax (dash / bash / zsh -n)
        run: |
          find run setup scripts .config/shell \( -name '*.sh' -o -name run \) -not -path '*/plugins/*' \
            -exec dash -n {} +
          for f in .zshenv $(find .config/zsh -name '.z*' -o -name '*.zsh' 2>/dev/null); do
            zsh -n "$f"
          done
          bash -n .bashrc && bash -n .bash_profile

      - name: shellcheck (warning and above)
        run: |
          find run setup scripts .config/shell \( -name '*.sh' -o -name run \) -not -path '*/plugins/*' \
            -exec shellcheck -S warning {} +

      - name: shfmt (.editorconfig is the authority, -d must stay silent)
        # shfmt SKIPS hidden files when walking a directory and has no flag
        # to include them: every zsh file must be listed EXPLICITLY or it
        # is silently unchecked.
        run: >
          shfmt -d run setup scripts .config/shell .bashrc .bash_profile
          .zshenv .config/zsh/.zshenv .config/zsh/.zshrc
          .config/zsh/.zprofile .config/zsh/fzf.zsh .config/zsh/zinit.zsh

      # yamllint is a pinned authority tool: unused, the pin is a lie.
      - name: yamllint (workflows, dependabot)
        run: yamllint .github
