---
# yamllint is a pinned authority tool (config.toml); this file states which
# of its defaults bend to the repo's own rules, and why.
extends: default

rules:
  # SHA-pinned `uses:` lines are 90-105 chars by construction, a full
  # 40-char commit SHA cannot shrink, and the pin is a security choice.
  line-length:
    max: 120
  # GitHub workflows key their triggers on `on:`; that is the platform's
  # schema, not a stray boolean.
  truthy:
    check-keys: false
