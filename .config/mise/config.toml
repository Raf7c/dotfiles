# Majors pinned on purpose: with "latest", two machines set up on different
# days diverge. Minor and patch still flow through `mise upgrade`; bump majors
# HERE, and `latest` only for low-risk plumbing. The pin list: docs/packages.md.
[tools]
neovim = "0.12"
node = "22"            # LTS
python = "3.13"
pipx = "latest"
rust = "1"
tree-sitter = "latest"
usage = "latest"       # required by `mise completion` (bash/zsh)

shellcheck = "0.11"
shfmt = "3.13"  # zsh support; upstream calls it incomplete, so zsh diffs get
                # READ, never applied blindly
yamllint = "1"
