# vim:ft=kitty
# kitty: the same visual identity on every machine. Same font, same
# Catppuccin auto light/dark. Byte-identical across both dotfiles repos.

# Theme: kitty (>= 0.38) follows the OS appearance through the
# *-theme.auto.conf files next to this one, the native equivalent of
# ghostty's `theme = light:...,dark:...`.

font_family JetBrainsMono Nerd Font Mono
font_size   21.0
# ghostty's adjust-cell-height = 35%: line air without a bigger font.
modify_font cell_height 135%

cursor_shape block
# Shell integration would force a beam cursor at the prompt: keep the
# integration, drop its cursor override.
shell_integration no-cursor

window_padding_width 10
background_opacity   0.96
background_blur      20

# Hide the pointer as soon as typing starts (ghostty: mouse-hide-while-typing).
mouse_hide_wait -1

copy_on_select yes
# macOS only; ignored on Linux (same as ghostty's macos-option-as-alt).
macos_option_as_alt yes

# tmux is always a "running program": the close confirmation would fire on
# every single window close, teaching the reflex of ignoring it.
confirm_os_window_close 0
