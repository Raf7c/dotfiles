# ~/.config/tmux/tmux.conf

# ------------------ Terminal ------------------
set -g default-terminal "tmux-256color"

set -as terminal-features ",*:RGB"
# Undercurl (wavy underline) for (neo)vim diagnostics
set -as terminal-features ",*:usstyle"
# Fallback truecolor for tmux < 3.2
set -ga terminal-overrides ",*:Tc"

# ------------------ Prefix ------------------
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# ------------------ Theme ------------------
# TMUX_THEME=light|dark forces the choice; otherwise probe the desktop.
# DEFAULT is dark: falling back to the light theme paints an unreadable
# pale-on-pale bar exactly where the probe fails (ssh, headless, non-GNOME).
# The test answers "is it light?", false everywhere else.
if-shell '\
  case "${TMUX_THEME:-}" in \
    light) true ;; \
    dark)  false ;; \
    *) case "$(uname -s)" in \
         Darwin) [ "$(defaults read -g AppleInterfaceStyle 2>/dev/null)" != "Dark" ] ;; \
         Linux)  gsettings get org.gnome.desktop.interface color-scheme 2>/dev/null | grep -q prefer-light ;; \
         *)      false ;; \
       esac ;; \
  esac' \
  'source-file ~/.config/tmux/themes/latte.conf' \
  'source-file ~/.config/tmux/themes/mocha.conf'

# ------------------ Options ------------------
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
# 10 ms: the upstream default since 3.5, plus a documented report of
# flaky M- bindings at 0 (tmux-sensible#41). Not an ssh guard: tmux
# already auto-extends to 500 ms for risky sequences since 3.6.
set -s escape-time 10
set -g focus-events on        # autoread (neo)vim + vim-tmux-navigator
# Scrollback is RAM, allocated per pane (lines x width): 1M was a ceiling
# nobody scrolls. 100k renders the same perceived service.
set -g history-limit 100000
set -g mouse on
set -g mode-keys vi
set -g set-clipboard on
set -g detach-on-destroy off
set -g status-interval 3

# allow-passthrough exists from tmux 3.3; every machine this config
# targets (brew on macOS, dnf on Fedora) ships >= 3.3: set it directly.
# Security floor is higher: >= 3.6b (CVE-2026-11623, Sixel use-after-free,
# and passthrough is exactly what lets those sequences through).
set -g allow-passthrough on

# ------------------ Splits / New window ------------------
unbind %
unbind '"'
bind b split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ------------------ Resize panes ------------------
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z

# ------------------ Copy mode (vi) ------------------
bind-key -T copy-mode-vi 'v'   send -X begin-selection
bind-key -T copy-mode-vi 'V'   send -X select-line
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -T copy-mode-vi Escape send -X clear-selection

# Cross-platform copy command. Every helper is probed with `command -v`:
# picking from $WAYLAND_DISPLAY alone runs a missing binary on a machine
# without wl-clipboard (no root to install it, the point of this repo)
# and silently loses every copy.
#   macOS         -> pbcopy
#   Linux Wayland -> wl-copy   (wl-clipboard package)
#   Linux X11     -> xclip
#   nothing       -> empty: OSC 52 alone (set-clipboard on, above), which
#                    needs no binary and works through ssh too.
set -g @copy_cmd ""
if-shell 'command -v pbcopy >/dev/null 2>&1' \
  'set -g @copy_cmd "pbcopy"'
if-shell '[ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1' \
  'set -g @copy_cmd "wl-copy"'
if-shell '[ -z "$WAYLAND_DISPLAY" ] && command -v xclip >/dev/null 2>&1' \
  'set -g @copy_cmd "xclip -selection clipboard"'

# copy-pipe-and-cancel with an EMPTY command copies nothing: bind the plain
# selection instead when no helper exists (the terminal still receives the
# text through OSC 52). ONE probe drives both branches, so the bindings can
# never disagree with the option set above.
# The condition below is EXACTLY the union of the three above: written any
# other way, the bindings and @copy_cmd end up disagreeing (Wayland session
# with xclip but no wl-copy: helper "found", @copy_cmd empty, copy lost).
if-shell 'command -v pbcopy >/dev/null 2>&1 \
  || { [ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1; } \
  || { [ -z "$WAYLAND_DISPLAY" ] && command -v xclip >/dev/null 2>&1; }' \
  'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{@copy_cmd}" ; \
   bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "#{@copy_cmd}"' \
  'bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel ; \
   bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel'

bind P paste-buffer
unbind -T copy-mode-vi MouseDragEnd1Pane

# ------------------ Swap windows ------------------
bind -r S-Left  run 'tmux swap-window -d -t #{e|-|:#I,1}'
bind -r S-Right run 'tmux swap-window -d -t #{e|+|:#I,1}'

# ------------------ Plugins ------------------
set -g @plugin 'tmux-plugins/tpm'
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor'

# ------------------ Resurrect ------------------
# Without this, resurrect saves to ~/.tmux/resurrect, a dotdir at the
# root of $HOME, against the whole XDG point. The plugin expands ~ itself.
set -g @resurrect-dir '~/.local/share/tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# ------------------ Continuum ------------------
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ------------------ Status right ------------------
set -g status-right " #{cpu}   #{mem}  󱛟 #{disk -f}"


# ------------------ TPM (keep at bottom) ------------------
run '~/.config/tmux/plugins/tpm/tpm'
