"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

# Only the runtimes actually installed: a module for a missing one costs a
# probe on every prompt and never prints anything.
format = "$directory$os$git_branch$git_status$nodejs$rust $character"

[os]
disabled = false
format = "[$symbol](blue) "

# MERGED with starship's defaults, not substituted: an entry removed from here
# falls back to starship's built-in EMOJI, it does not disappear. So only the
# two systems this prompt actually runs on are named -- macOS, and Arch for
# the Omarchy machine to come. Measured with starship 1.26.0.
[os.symbols]
Macos = ""
Arch = "󰣇"

[directory]
format            = "[$path](cyan) "
truncation_length = 4
truncate_to_repo  = true

[git_branch]
symbol = ""
format = "[$symbol $branch](bold purple) "

[git_status]
format     = "($ahead_behind$staged$modified$untracked$deleted$conflicted)"
ahead      = "[⇡$count ](bold cyan)"
behind     = "[⇣$count ](bold cyan)"
diverged   = "[⇡$ahead_count⇣$behind_count ](bold cyan)"
staged     = "[+$count ](bold green)"
modified   = "[●$count ](bold yellow)"
untracked  = "[?$count ](bold white)"
deleted    = "[✘$count ](bold red)"
conflicted = "[⚡$count ](bold red)"

[nodejs]
symbol = ""
format = "[$symbol $version](green) "

[rust]
symbol = ""
format = "[$symbol $version](red) "

[character]
success_symbol = "[❯](green)"
error_symbol   = "[❯](red)"
vimcmd_symbol  = "[❮](blue)"
